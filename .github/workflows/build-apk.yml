# Builds a debug APK on GitHub (no PC / Android Studio needed):
# push to main (or Run workflow) -> download GEN-Z LUDO KING debug APK
# from the Actions tab -> Artifacts.
# The repo has Capacitor config but no android/ folder (android/ is
# gitignored); CI runs `npx cap add android` + Gradle with JDK 21 +
# Android SDK. No secrets needed: firebase.js falls back to demo/guest
# mode when the VITE_FIREBASE_* vars are absent, so the build works
# without .env.
name: Build Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync

      # Capacitor 7 / AGP needs Java 21 (JDK 17 fails with
      # "invalid source release: 21" in :capacitor-android).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # NOTE: do NOT use android-actions/setup-android — it runs
      # `sdkmanager tools`, a package that no longer exists, and fails
      # with exit code 1. ubuntu-latest already ships a full Android
      # SDK (ANDROID_SDK_ROOT), so Gradle uses that directly.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" | tail -5
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed | tail -10

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gen-z-ludo-king-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
